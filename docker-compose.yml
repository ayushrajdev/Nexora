services:
  # ─────────────────────────────────────
  #  Infrastructure
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    # Expose port 6379 to the host system
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────
  #  API Gateway (ONLY PUBLIC ROUTE TO SERVICES)
  # ─────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - SERVICE_NAME=api-gateway
      - PORT=3000
      - REDIS_HOST=redis
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PROFILE_SERVICE_URL=http://profile-service:3002
      - MATCHING_SERVICE_URL=http://matching-service:3003
      - CHAT_SERVICE_URL=http://chat-service:3004
      - PAYMENT_SERVICE_URL=http://payment-service:3005
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────
  #  Auth Service (Private / Internal Only)
  # ─────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    expose:
      - "3001"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=auth-service
      - PORT=3001
      - REDIS_HOST=redis
      - DB_CONNECTION_STRING=mongodb://host.docker.internal:27017/devtinder_auth?directConnection=true
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────
  #  Profile Service (Private / Internal Only)
  # ─────────────────────────────────────
  profile-service:
    build:
      context: .
      dockerfile: ./services/profile-service/Dockerfile
    expose:
      - "3002"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=profile-service
      - PORT=3002
      - REDIS_HOST=redis
      - DB_CONNECTION_STRING=mongodb://host.docker.internal:27017/devtinder_auth?directConnection=true
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────
  #  Matching Service (Private / Internal Only)
  # ─────────────────────────────────────
  matching-service:
    build:
      context: .
      dockerfile: ./services/matching-service/Dockerfile
    expose:
      - "3003"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=matching-service
      - PORT=3003
      - REDIS_HOST=redis
      - DB_CONNECTION_STRING=mongodb://host.docker.internal:27017/devtinder_matching?directConnection=true
      - PROFILE_SERVICE_URL=http://profile-service:3002
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────
  #  Chat Service (Private / Internal Only)
  # ─────────────────────────────────────
  chat-service:
    build:
      context: .
      dockerfile: ./services/chat-service/Dockerfile
    expose:
      - "3004"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=chat-service
      - PORT=3004
      - REDIS_HOST=redis
      - DB_CONNECTION_STRING=mongodb://host.docker.internal:27017/devtinder_chat?directConnection=true
      - MATCHING_SERVICE_URL=http://matching-service:3003
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────
  #  Payment Service (Private / Internal Only)
  # ─────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    expose:
      - "3005"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=payment-service
      - PORT=3005
      - REDIS_HOST=redis
      - DB_CONNECTION_STRING=mongodb://host.docker.internal:27017/devtinder_payment?directConnection=true
      - PROFILE_SERVICE_URL=http://profile-service:3002
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────
  #  Notification Service (Private / Internal Only)
  # ─────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    expose:
      - "3006"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVICE_NAME=notification-service
      - PORT=3006
      - REDIS_HOST=redis
      - DB_CONNECTION_STRING=mongodb://host.docker.internal:27017/devtinder_auth?directConnection=true
      - PROFILE_SERVICE_URL=http://profile-service:3002
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
